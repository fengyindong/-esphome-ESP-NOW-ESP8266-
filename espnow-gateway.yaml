substitutions:
  device_name: espnow-gateway
  friendly_name: ESP-NOW Gateway
  sensor_node_mac: "02:00:00:00:00:02"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp8266:
  board: nodemcuv2

logger:
  level: DEBUG
  baud_rate: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  - source:
      type: local
      path: components
    components:
      - espnow
      - packet_transport

espnow:
  id: espnow_bus
  role: combo
  auto_add_peer: false
  peers:
    - mac: ${sensor_node_mac}
      id: sensor_node_peer
      channel: 0
      role: combo
      rolling_code: false

packet_transport:
  - platform: espnow
    id: gateway_transport
    espnow_id: espnow_bus
    peer_address: ${sensor_node_mac}
    update_interval: 30s
    rolling_code_enable: false
    ping_pong_enable: false

sensor:
  - platform: packet_transport
    transport_id: gateway_transport
    provider: espnow-sensor-node
    remote_id: aht20_temperature
    id: remote_aht20_temperature
    name: AHT20 Temperature
    internal: false
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1

  - platform: packet_transport
    transport_id: gateway_transport
    provider: espnow-sensor-node
    remote_id: aht20_humidity
    id: remote_aht20_humidity
    name: AHT20 Humidity
    internal: false
    device_class: humidity
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 1

  - platform: packet_transport
    transport_id: gateway_transport
    provider: espnow-sensor-node
    remote_id: bmp280_temperature
    id: remote_bmp280_temperature
    name: BMP280 Temperature
    internal: false
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1

  - platform: packet_transport
    transport_id: gateway_transport
    provider: espnow-sensor-node
    remote_id: bmp280_pressure
    id: remote_bmp280_pressure
    name: BMP280 Pressure
    internal: false
    device_class: atmospheric_pressure
    state_class: measurement
    unit_of_measurement: hPa
    accuracy_decimals: 1

